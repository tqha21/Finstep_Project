global:
  scrape_interval: 1s
  evaluation_interval: 1s
alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]
rule_files: [/etc/prometheus/alerts.yml, /etc/prometheus/reliability-alerts.yml]
scrape_configs:
  - job_name: finstep-backup
    static_configs:
      - targets: [backup-metrics:9100]
  - job_name: delivery-fixture
    static_configs:
      - targets: [receiver:8080]
