global:
  scrape_interval: 15s
  evaluation_interval: 15s
alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]
rule_files: [/etc/prometheus/alerts.yml]
scrape_configs:
  - job_name: finstep-api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [api-internal:9090]
  - job_name: finstep-readiness
    metrics_path: /probe
    params: {module: [http_ok]}
    static_configs:
      - targets: [http://api-internal:9090/actuator/health/readiness, http://web:3000/]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
  - job_name: finstep-backup
    static_configs:
      - targets: [backup-metrics:9100]
