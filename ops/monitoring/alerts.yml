groups:
  - name: finstep
    rules:
      - alert: FinstepApiDown
        expr: up{job="finstep-api"} == 0
        for: 1m
        labels: {severity: critical}
        annotations: {summary: "Finstep API scrape is failing"}
      - alert: FinstepReadinessFailed
        expr: probe_success{job="finstep-readiness"} == 0
        for: 1m
        labels: {severity: critical}
        annotations: {summary: "Finstep readiness probe is failing"}
      - alert: FinstepHighServerErrors
        expr: sum(rate(http_server_requests_seconds_count{job="finstep-api",status=~"5..",uri!~"/actuator.*"}[5m])) / clamp_min(sum(rate(http_server_requests_seconds_count{job="finstep-api",uri!~"/actuator.*"}[5m])), 0.001) > 0.05 and sum(increase(http_server_requests_seconds_count{job="finstep-api",uri!~"/actuator.*"}[5m])) > 20
        for: 5m
        labels: {severity: warning}
        annotations: {summary: "Finstep server error ratio exceeds 5 percent"}
      - alert: FinstepDatabasePoolWaiting
        expr: hikaricp_connections_pending{job="finstep-api"} > 0
        for: 2m
        labels: {severity: warning}
        annotations: {summary: "Finstep database connections are waiting"}
      - alert: FinstepOffsiteBackupFailed
        expr: finstep_backup_offsite_last_attempt_success{job="finstep-backup"} == 0
        for: 1m
        labels: {severity: critical}
        annotations: {summary: "Finstep offsite backup attempt failed"}
      - alert: FinstepOffsiteBackupOverdue
        expr: time() - finstep_backup_offsite_last_success_timestamp_seconds{job="finstep-backup"} > 93600
        for: 5m
        labels: {severity: warning}
        annotations: {summary: "Finstep has no verified offsite backup in 26 hours"}
      - alert: FinstepBackupStatusMissing
        expr: absent(finstep_backup_offsite_last_success_timestamp_seconds{job="finstep-backup"})
        for: 15m
        labels: {severity: warning}
        annotations: {summary: "Finstep backup status metrics are missing"}
