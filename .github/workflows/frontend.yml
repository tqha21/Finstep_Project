name: Frontend and full-stack browser tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build and verify backend for isolated E2E
        working-directory: backend
        run: ./mvnw --batch-mode --no-transfer-progress verify
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci --no-fund
      - name: Verify production frontend
        working-directory: frontend
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          npm run lint
          npm run build
          npm run typecheck
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run isolated full-stack browser tests
        run: bash scripts/test-web.sh
      - name: Retain browser results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-results
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
