name: Staging HTTPS and recovery rehearsal
on: [push, pull_request]
permissions:
  contents: read
jobs:
  operations:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Package backend (the Backend workflow runs its integration suite)
        working-directory: backend
        run: ./mvnw --batch-mode --no-transfer-progress -DskipTests package
      - name: Build standalone frontend
        working-directory: frontend
        env:
          API_ORIGIN: http://api-internal:8080
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          npm ci --no-fund
          npm run build
      - name: Validate staging configuration guards
        run: |
          python3 scripts/test-staging-preflight.py
          bash -n scripts/backup-db.sh scripts/restore-rehearsal.sh scripts/test-operations.sh
      - name: Test isolated HTTPS stack, alerts and encrypted recovery
        run: bash scripts/test-operations.sh
      - name: Retain operational logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: operations-logs
          path: artifacts/operations/
          if-no-files-found: ignore
          retention-days: 7
