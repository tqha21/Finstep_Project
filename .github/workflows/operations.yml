name: Staging HTTPS, recovery and load regression
on: [push, pull_request]
permissions:
  contents: read
jobs:
  operations:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Package backend (the Backend workflow runs its integration suite)
        working-directory: backend
        run: ./mvnw --batch-mode --no-transfer-progress -DskipTests package
      - name: Build standalone frontend
        working-directory: frontend
        env:
          API_ORIGIN: http://api-internal:8080
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          npm ci --no-fund
          npm run build
      - name: Install S3 transfer CLI
        run: |
          sudo apt-get update
          sudo apt-get install --yes rclone
      - name: Validate staging configuration guards
        run: |
          python3 scripts/test-staging-preflight.py
          python3 scripts/test-backup-store.py
          python3 scripts/test-alert-config.py
          python3 scripts/test-load-runner.py
          bash -n scripts/backup-db.sh scripts/restore-rehearsal.sh scripts/test-operations.sh scripts/test-load.sh
      - name: Test isolated HTTPS stack, alerts and encrypted recovery
        run: bash scripts/test-operations.sh
      - name: Test verified S3 publication and authenticated alert delivery
        run: bash scripts/test-reliability.sh
      - name: Test bounded multi-user HTTPS load and exact ledger reconciliation
        run: bash scripts/test-load.sh
      - name: Retain sanitized load report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-report
          path: artifacts/load/report.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Retain operational logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: operations-logs
          path: |
            artifacts/operations/
            artifacts/reliability/
            artifacts/load/*.log
          if-no-files-found: ignore
          retention-days: 7
